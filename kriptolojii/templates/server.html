<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-soft">
  <div class="container py-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white rounded-top-4 d-flex justify-content-between align-items-center">
        <div>
          <div class="fw-bold text-success">SERVER</div>
          <div class="text-muted small">Gelen şifreli mesajlar çözülüp burada listelenir.</div>
        </div>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="/client">Client</a>
          <button class="btn btn-success btn-sm" id="refresh-inbox">Yenile</button>
        </div>
      </div>
      <div class="card-body p-4">
        <div class="alert alert-secondary small">
          Wireshark için: Loopback (Npcap) üzerinden 127.0.0.1:5000 TCP trafiğini yakala ve payload'un Base64 göründüğünü göster.
        </div>

        <div id="server-inbox" class="vstack gap-3"></div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
